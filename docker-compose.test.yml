services:
  postgres:
    image: "postgres:latest"
    ports:
      - "5432:5432"
    environment:
      - "POSTGRES_DB=postgres"
      - "POSTGRES_PASSWORD=pass"
      - "POSTGRES_USER=postgres"
  test-postgres:
    image: "postgres:latest"
    ports:
      - "5433:5432"
    environment:
      - "POSTGRES_DB=test_db"
      - "POSTGRES_PASSWORD=test_pass"
      - "POSTGRES_USER=test_user"
    volumes:
      - ./skemr-api/testdata/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql:ro
  redis:
    image: 'redis:7-alpine'
    ports:
      - '6379:6379'
  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    environment:
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_ALIAS=local-redis
  gitlab:
    image: "gitlab/gitlab-ce:latest"
    container_name: gitlab
    ports:
      - "80:80"
      - "443:443"
      - "2222:22"
    environment:
        GITLAB_OMNIBUS_CONFIG: |
          external_url 'http://gitlab'
          gitlab_rails['initial_root_password'] = 'password'
          gitlab_rails['allow_local_requests_from_web_hooks_and_services'] = true
          gitlab_rails['allow_local_requests_from_system_hooks'] = true
    volumes:
      - "./gitlab/config/gitlab:/etc/gitlab"
      - "./gitlab/logs/gitlab:/var/log/gitlab"
      - "./gitlab/data/gitlab:/var/opt/gitlab"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - ci
  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    depends_on:
      - gitlab
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./gitlab-runner/config:/etc/gitlab-runner"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - ci
  smtp4dev:
    image: rnwood/smtp4dev:latest
    container_name: skemr-smtp4dev
    ports:
      - "5000:80"
      - "5025:25"
    environment:
      - ServerOptions__HostName=smtp4dev

volumes:
  mailpit-data:

networks:
  ci:
    name: gitlab-ci-network