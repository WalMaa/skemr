services:
  app:
    build:
        context: .
        dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      APP_ENV: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: pass
      DB_NAME: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      SMTP_HOST: smtp4dev
      SMTP_PORT: 25
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ""
  postgres:
    image: "postgres:latest"
    ports:
      - "5432:5432"
    environment:
      - "POSTGRES_DB=postgres"
      - "POSTGRES_PASSWORD=pass"
      - "POSTGRES_USER=postgres"
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "pg_stat_statements.max=10000"
  redis:
    image: 'redis:7-alpine'
    ports:
      - '6379:6379'